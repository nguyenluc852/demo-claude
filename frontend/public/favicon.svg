<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A house with its rooms showing. Three lit windows rather than one, because
    this is a building let by the room, not a single home. Drawn on a rounded
    orange tile so it stays legible at 16px, where an outline mark disappears.
  -->
  <rect width="64" height="64" rx="16" fill="#ef944f"/>
  <path d="M32 13.5 51 29v20a2.5 2.5 0 0 1-2.5 2.5h-33A2.5 2.5 0 0 1 13 49V29z"
        fill="none" stroke="#23190f" stroke-width="3.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="21.5" y="33" width="7" height="6.5" rx="1.6" fill="#23190f"/>
  <rect x="35.5" y="33" width="7" height="6.5" rx="1.6" fill="#23190f"/>
  <path d="M28 51.5v-7a4 4 0 0 1 8 0v7z" fill="#23190f"/>
</svg>
