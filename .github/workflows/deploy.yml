name: Deploy

# Push vào main là deploy — nhưng chỉ sau khi ci.yml xanh (job `check` bên dưới
# gọi lại đúng workflow đó, không copy lệnh).
#
# Mọi credential đến từ GitHub Secrets của environment `production`; không có
# giá trị nào nằm trong file này, và không lệnh nào in secret ra log.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

# Hai lần push liền nhau không được deploy chồng lên nhau, nhưng cũng không huỷ
# một bản deploy đang chạy dở.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  backend:
    name: Backend → Render
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deploy hook là một URL bí mật; Render tự build từ render.yaml, nên ở đây
      # không cần Atlas connection string hay bất cứ biến runtime nào.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Thiếu secret RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          # Không có scheme thì curl coi cả giá trị là hostname và chỉ báo
          # "could not resolve host: ***" — dấu hiệu ai đó dán thiếu phần đầu
          # URL. So khớp bằng case nên không có giá trị nào bị in ra.
          case "$HOOK" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "RENDER_DEPLOY_HOOK_URL phải là URL đầy đủ, dạng" >&2
              echo "https://api.render.com/deploy/srv-xxxx?key=yyyy" >&2
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --output /dev/null "$HOOK"
          echo "Đã gửi yêu cầu deploy sang Render."

      # Render build mất vài phút; poll /api/v1/health để job chỉ xanh khi bản
      # mới thực sự phục vụ được. RENDER_HEALTH_URL là URL công khai, để ở
      # Variables cũng được.
      - name: Wait for health check
        env:
          HEALTH: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH" ]; then
            echo "Bỏ qua: chưa đặt biến RENDER_HEALTH_URL."
            exit 0
          fi
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 20 "$HEALTH" | grep -q '"status":"ok"'; then
              echo "Backend đã lên sau $i lần thử."
              exit 0
            fi
            sleep 15
          done
          echo "Backend không trả health trong 10 phút." >&2
          exit 1

  frontend:
    name: Frontend → Vercel
    needs: check
    runs-on: ubuntu-latest
    environment: production
    # Ba biến này cố ý KHÔNG khai báo ở cấp job: bước "Check secrets" cắt khoảng
    # trắng rồi ghi vào $GITHUB_ENV, và một khai báo ở cấp job hay cấp step sẽ
    # che mất bản đã cắt đó.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Thiếu secret thì Vercel CLI báo "--token missing a value", nghe như lỗi
      # cú pháp chứ không phải thiếu cấu hình. Chặn sớm với thông báo đúng bệnh.
      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          if [ -z "$VERCEL_TOKEN" ]; then missing="$missing VERCEL_TOKEN"; fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing="$missing VERCEL_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "Thiếu secret:$missing — xem bảng trong DEPLOY.md" >&2
            exit 1
          fi

          # Paste một secret kèm xuống dòng là lỗi vô hình: CLI gửi id sai một
          # ký tự rồi báo "Could not retrieve Project Settings", nghe như sai
          # quyền. Cắt sạch khoảng trắng rồi mới dùng.
          {
            printf 'VERCEL_TOKEN=%s\n' "$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')"
            printf 'VERCEL_ORG_ID=%s\n' "$(printf %s "$VERCEL_ORG_ID" | tr -d '[:space:]')"
            printf 'VERCEL_PROJECT_ID=%s\n' "$(printf %s "$VERCEL_PROJECT_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"

          # Chỉ in độ dài, không in giá trị. org id đúng dài 29, project id 32;
          # lệch nghĩa là secret dính ký tự thừa.
          echo "độ dài: org=${#VERCEL_ORG_ID} project=${#VERCEL_PROJECT_ID}"

      # Tách "token có hợp lệ không" khỏi "token có thấy project không".
      # whoami hỏng = token sai hoặc hết hạn; whoami chạy được mà pull hỏng =
      # token đúng nhưng không thuộc scope chứa project.
      - name: Who is this token
        run: |
          vercel whoami --token="$VERCEL_TOKEN"
          echo "--- project trong scope này ---"
          vercel project ls --token="$VERCEL_TOKEN"

      # `vercel build` đọc vercel.json ở gốc repo — cùng buildCommand và
      # rewrites như khi deploy tay, nên không có đường build thứ hai.
      - name: Pull project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
