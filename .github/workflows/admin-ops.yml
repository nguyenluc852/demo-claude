name: Admin ops

# Chạy tay các script quản trị (`backend/scripts/`) trên database production mà
# KHÔNG phải dán connection string Atlas hay mật khẩu admin vào terminal của bạn.
#
# Đó là lý do file này tồn tại: secret chỉ nằm trong GitHub Secrets của
# environment `production`, được nạp vào tiến trình dưới dạng biến môi trường, và
# không script nào in giá trị ra — xem .claude/rules/secrets-from-env.md.
#
# Đổi mật khẩu admin = cập nhật secret SEED_ADMIN_PASSWORD rồi chạy
# `set-admin-password`. Mật khẩu mới không bao giờ đi qua máy bạn dưới dạng lệnh
# shell, nên không nằm lại trong shell history.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Script cần chạy"
        required: true
        type: choice
        options:
          - seed
          - set-admin-password
          - set-admin-email
          - reset-invoice-draft
          - set-contract-email
      period:
        description: "reset-invoice-draft: kỳ hoá đơn YYYY-MM (bắt buộc)"
        required: false
        type: string
      room:
        description: "reset-invoice-draft / set-contract-email: số phòng"
        required: false
        type: string
      email:
        description: "set-contract-email: email khách thuê mới"
        required: false
        type: string

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    # Bật required reviewers cho environment này nếu muốn mỗi lần chạy phải có
    # người duyệt.
    environment: production

    defaults:
      run:
        working-directory: backend

    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}
      MONGODB_DB: ${{ vars.MONGODB_DB || 'motel' }}
      SEED_ADMIN_USERNAME: ${{ vars.SEED_ADMIN_USERNAME || 'admin' }}
      SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      RESET_PERIOD: ${{ inputs.period }}
      RESET_ROOM: ${{ inputs.room }}
      CONTRACT_ROOM: ${{ inputs.room }}
      CONTRACT_EMAIL: ${{ inputs.email }}
      # Script nào lỡ khởi tạo mailer cũng chỉ ghi log, không gửi thật.
      RESEND_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$MONGODB_URL" ]; then
            echo "Thiếu secret MONGODB_URL" >&2
            exit 1
          fi

      - name: Seed demo data
        if: inputs.action == 'seed'
        run: python -m scripts.seed

      - name: Set admin password
        if: inputs.action == 'set-admin-password'
        run: python -m scripts.set_admin_password

      - name: Set admin email
        if: inputs.action == 'set-admin-email'
        run: python -m scripts.set_admin_email

      # Đưa hoá đơn đã phát hành về nháp để lần dispatch sau gửi lại. Hoá đơn đã
      # trả một phần hoặc đã trả đủ thì bị bỏ qua, không mất trạng thái thanh toán.
      - name: Reset invoices to draft
        if: inputs.action == 'reset-invoice-draft'
        run: python -m scripts.reset_invoice_draft

      # Đổi email khách thuê của hợp đồng đang hiệu lực. Đi qua
      # contract_service.update() nên vẫn reset trạng thái xác thực như khi sửa
      # trong CMS — link xác minh chỉ được ghi log vì RESEND_API_KEY để trống ở đây.
      - name: Set contract email
        if: inputs.action == 'set-contract-email'
        run: python -m scripts.set_contract_email
