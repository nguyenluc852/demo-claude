# Backend blueprint for Render.
#
# Vercel hosts the frontend and rewrites /api/* here (see vercel.json), so the
# browser still sees a single origin — the same arrangement the Vite proxy and
# nginx.conf give in dev and in Docker.
#
# Render is used rather than a serverless platform because app/main.py starts
# APScheduler inside the FastAPI lifespan: the monthly draft-invoice mailer
# needs a process that stays alive between requests.
#
# The Dockerfile's last stage is `prod`, which is what an untargeted build
# produces — unprivileged user, app/ only, no dev dependencies.

services:
  - type: web
    name: ancu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The image's CMD pins port 8000; Render routes to $PORT instead.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    region: singapore
    plan: free
    # Deploy do .github/workflows/deploy.yml kích hoạt qua deploy hook, sau khi
    # CI xanh. Để Render tự deploy theo push thì code chưa qua test cũng lên
    # production, và hai bản deploy sẽ chạy chồng nhau.
    autoDeploy: false
    envVars:
      # Paste the MongoDB Atlas connection string in the Render dashboard.
      # mongodb+srv:// works because dnspython arrives with email-validator.
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: motel

      # Generated once by Render and kept; rotating it signs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # Where verification links in tenant emails point — the Vercel URL, not
      # this API's. Left unset, links point at localhost and tenants cannot
      # verify their email at all.
      - key: PUBLIC_BASE_URL
        value: https://claudedom.vercel.app

      # Pydantic parses list fields as JSON, so this stays a JSON array.
      # Only needed if something reaches the API cross-origin; the Vercel
      # rewrite itself is server-side and involves no preflight.
      - key: CORS_ORIGINS
        value: '["https://claudedom.vercel.app"]'

      # Mail leaves over the Resend HTTP API, not SMTP: Render blocks outbound
      # 25/465/587 at the network layer, so every SMTP send here times out after
      # 60s no matter which TLS mode is used. Port 443 is never blocked.
      # Clear RESEND_API_KEY and services/email.py logs the message instead of
      # sending it — every flow still runs, the mail just never leaves.
      - key: RESEND_API_KEY
        sync: false
      # Must be on a domain verified in Resend, or mail is rejected.
      - key: EMAIL_FROM
        sync: false

      # Gói free ngủ giữa các request, nên APScheduler trong lifespan không bao
      # giờ sống tới ngày nổ job. Tắt nó đi và để cron ngoài gọi
      # POST /api/v1/invoices/dispatch — cùng một invoice_service.send_pending(),
      # không phải nhánh logic thứ hai. Nâng lên Starter thì đổi lại thành true
      # và tắt workflow invoice-dispatch.yml, đừng chạy song song cả hai.
      - key: SCHEDULER_ENABLED
        # Quoted: một boolean YAML trần có thể tới backend thành "False", còn
        # pydantic chỉ nhận "false"/"0"/"no".
        value: "false"

      # Secret dùng chung cho header X-Cron-Secret của endpoint dispatch. Điền ở
      # dashboard Render, và dán đúng giá trị đó vào GitHub Secret CRON_SECRET.
      # Để trống thì CronDep từ chối mọi request — fail closed, không bao giờ mở.
      - key: CRON_SECRET
        sync: false
